version: '3.9'
services:
  db:
    image: mariadb:10.11
    container_name: evalcoach_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/coachingnew.sql:/docker-entrypoint-initdb.d/coachingnew.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - evalcoach_net

  backend:
    build: ./backend
    container_name: evalcoach_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8074:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evalcoach_net

  frontend:
    build: ./frontend
    container_name: evalcoach_frontend
    restart: always
    ports:
      - "8073:80"
    depends_on:
      - backend
    networks:
      - evalcoach_net

networks:
  evalcoach_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.60.0/24

volumes:
  db_data:
  uploads_data: